# Run with Docker Desktop's Windows CLI (PowerShell), not the Linux CLI in WSL.
# Windows bind paths are single-quoted so YAML preserves their backslashes.
# The read-only ./data mount is inherited from docker-compose.yml.
services:
  backend:
    # The backend bind hides the image's copy of ingestion; expose it alongside app.
    environment:
      PYTHONPATH: /home/nyaya
      LLM_PRIMARY_TIMEOUT_S: "240"
      LLM_FALLBACK_TIMEOUT_S: "60"
      LLM_WALL_CLOCK_S: "300"
    volumes:
      - type: bind
        source: ./backend
        target: /home/nyaya/app
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: 'C:\Users\yashd\.cache\huggingface'
        target: /home/nyaya/.cache/huggingface
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./ingestion
        target: /home/nyaya/ingestion
        read_only: true
        bind:
          create_host_path: false
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/home/nyaya/app/app"]
