# Test environment — ephemeral databases, runs pytest then exits
services:
  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://nyayaml:test@postgres-test:5432/nyayaml_test
      - REDIS_URL=redis://redis-test:6379/0
      - QDRANT_URL=http://qdrant-test:6333
      - ENVIRONMENT=testing
      - SECRET_KEY=test-secret-key-not-for-production
    command: python -m pytest tests/ -v --tb=short
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy

  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nyayaml
      POSTGRES_PASSWORD: test
      POSTGRES_DB: nyayaml_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyayaml -d nyayaml_test"]
      interval: 3s
      timeout: 2s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 3
